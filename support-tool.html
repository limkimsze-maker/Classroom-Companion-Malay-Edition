<!doctype html>
<html lang="ms-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pembantu Bilik Darjah • Edisi Bahasa Melayu</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100%;border:0;background:#fff}</style>
</head>
<body>
<iframe id="sourceFrame" title="Pembantu Bilik Darjah" allow="autoplay; fullscreen" allowfullscreen></iframe>
<script src="malay-translate.js?v=20261010tt1"></script>
<script>
'use strict';
const p=new URLSearchParams(location.search),tool=p.get('tool')||'timer-calm-music',display=p.get('display')||'';
const frame=document.getElementById('sourceFrame');
frame.src='/Classroom-Companion/support-tool.html?tool='+encodeURIComponent(tool)+(display?'&display='+encodeURIComponent(display):'')+'&v='+Date.now();
function stabiliseMalayTimetable(){
  if(tool!=='daily-visual-timetable')return;
  try{
    const w=frame.contentWindow,d=frame.contentDocument;
    if(!w||!d)return;
    if(!w.__ccMalayTimetableStorageGuard){
      w.__ccMalayTimetableStorageGuard=true;
      w.addEventListener('storage',e=>{
        if(e.key==='classroomCompanionV1'||e.key==='classroomCompanionClassMasterV1')e.stopImmediatePropagation();
      },true);
    }
    if(d.getElementById('pasteZone'))return;
    if(!w.Support||w.Support.slug!=='daily-visual-timetable'||w.__ccMalayTimetableRepairing)return;
    w.__ccMalayTimetableRepairing=true;
    const s=d.createElement('script');
    s.src='/Classroom-Companion/timetable-screenshot.js?v=20261010msrepair1';
    s.onload=()=>{w.__ccMalayTimetableRepairing=false};
    s.onerror=()=>{w.__ccMalayTimetableRepairing=false};
    d.body.appendChild(s);
  }catch(e){}
}
frame.addEventListener('load',()=>{
  window.CCMalay?.attach(frame,{tool});
  if(tool==='daily-visual-timetable'){
    setTimeout(stabiliseMalayTimetable,250);
    setTimeout(stabiliseMalayTimetable,900);
    setTimeout(stabiliseMalayTimetable,1800);
  }
  if(display==='fullscreen'){
    try{
      const d=frame.contentDocument,s=d.createElement('script');
      s.src='/Classroom-Companion/fullscreen-tool-layout.js?v=20261006full1';
      d.body.appendChild(s);
    }catch(e){}
  }
});
</script>
</body>
</html>
